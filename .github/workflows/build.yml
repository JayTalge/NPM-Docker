name: Build image from upstream release

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to build (empty = newest release)"
        required: false
      force:
        description: "Rebuild even if the image is up to date"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["Dockerfile", "node-overlay.sh", "resolve-versions.py", "smoke.sh", ".github/workflows/build.yml"]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_IMAGE: docker.io/jc21/nginx-proxy-manager
  IMAGE: ghcr.io/jaytalge/nginx-proxy-manager
  NODE_MAJOR: "26"
  # only the newest minor line: upstream does not patch older lines, and they ship older node majors
  WINDOW: "1"
  NODE_FLAVOR: trixie-slim

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      node: ${{ steps.r.outputs.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Resolve versions to build
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.version }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          inspect() { skopeo inspect --override-os linux --override-arch amd64 "$@"; }

          # the newest GitHub release is upstream's stable version
          LATEST=$(gh api repos/NginxProxyManager/nginx-proxy-manager/releases/latest --jq .tag_name)
          NODE=$(inspect "docker://docker.io/library/node:$NODE_MAJOR-$NODE_FLAVOR" | jq -r '.Env[] | select(startswith("NODE_VERSION=")) | sub("NODE_VERSION="; "")')
          echo "upstream latest $LATEST, node $NODE"

          export LATEST ONLY
          skopeo list-tags "docker://$UPSTREAM_IMAGE" | jq -r '.Tags[]' | python3 resolve-versions.py > candidates.json

          todo='[]'
          for row in $(jq -c '.[]' candidates.json); do
            v=$(jq -r .version <<<"$row")
            want="$v/node-$NODE"
            have=$(inspect --creds "$CREDS" "docker://$IMAGE:$v" 2>/dev/null | jq -r '.Labels["de.jason-talge.build-key"] // empty' || true)
            if [ "$FORCE" = "true" ] || [ "$have" != "$want" ]; then
              echo "build $v (have '${have:-none}', want '$want')"
              todo=$(jq -c --argjson r "$row" '. + [$r]' <<<"$todo")
            else
              echo "skip $v (up to date)"
            fi
          done
          echo "matrix=$todo" >> "$GITHUB_OUTPUT"
          echo "node=$NODE" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build for test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          build-args: |
            NPM_VERSION=${{ matrix.version }}
            NODE_VERSION=${{ needs.resolve.outputs.node }}
          tags: npm:smoke

      - name: Smoke test
        run: ./smoke.sh npm:smoke "${{ matrix.version }}" "${{ needs.resolve.outputs.node }}"

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NPM_VERSION=${{ matrix.version }}
            NODE_VERSION=${{ needs.resolve.outputs.node }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.version }}
            ${{ env.IMAGE }}:${{ matrix.minor }}
            ${{ matrix.latest && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            de.jason-talge.build-key=${{ matrix.version }}/node-${{ needs.resolve.outputs.node }}
